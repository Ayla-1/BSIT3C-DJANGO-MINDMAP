<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 50px;
            background-color: #f8f9fa;
        }
        .test-navbar {
            background-color: #ff6b9d;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .test-navbar a {
            color: white !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dropdown Test Page</h1>
        <p>This page tests if Bootstrap dropdown is working</p>
        
        <div class="test-navbar">
            <div class="d-flex justify-content-between align-items-center">
                <strong style="color: white;">🧠 MindMap</strong>
                
                <div class="dropdown">
                    <button class="btn btn-light dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                        Test Dropdown
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">
                        <li><a class="dropdown-item" href="#">Option 1</a></li>
                        <li><a class="dropdown-item" href="#">Option 2</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#">Option 3</a></li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="alert alert-info">
            <strong>Instructions:</strong>
            <ol>
                <li>Click the "Test Dropdown" button above</li>
                <li>The dropdown menu should appear</li>
                <li>If it works here, the main navigation should work too</li>
            </ol>
        </div>
        
        <a href="/home/" class="btn btn-primary">Back to Dashboard</a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        console.log('Bootstrap loaded:', typeof bootstrap !== 'undefined');
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            var dropdown = document.getElementById('dropdownMenuButton');
            if (dropdown) {
                console.log('Dropdown element found');
                dropdown.addEventListener('click', function() {
                    console.log('Dropdown clicked!');
                });
            }
        });
    </script>
</body>
</html>
